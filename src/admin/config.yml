# Decap CMS — connected via DecapBridge (PKCE auth)
backend:
  name: git-gateway
  repo: anvold95/andreasvold
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/10fb9be3-f6da-43e4-b823-04ea7964ee9f/pkce
  auth_token_endpoint: /sites/10fb9be3-f6da-43e4-b823-04ea7964ee9f/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://andreasvold.no
display_url: https://andreasvold.no

media_folder: "src/assets/imagery/uploads"
public_folder: "/assets/imagery/uploads"

publish_mode: editorial_workflow

collections:
  # ░░░ Projects ░░░
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{year}} · {{code}} — {{title}}"
    sortable_fields: ["sort_year", "year", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Project code", name: "code", widget: "string", hint: "Short tag like RC23 or GEO22" }
      - { label: "Year (display)", name: "year", widget: "string", hint: "e.g. 2022 or 2022—2023" }
      - { label: "Year (for sorting)", name: "sort_year", widget: "string", hint: "Just one year, used to order the index. e.g. 2023" }
      - { label: "Type", name: "type", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "School", name: "school", widget: "string", required: false }
      - { label: "Institution", name: "institution", widget: "string", required: false }
      - label: "Extra metadata rows"
        name: "meta"
        widget: "list"
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
      - { label: "Blurb", name: "blurb", widget: "text", required: false }
      - { label: "Body (optional long text, HTML allowed)", name: "content_body", widget: "text", required: false }
      - label: "Links (optional)"
        name: "links"
        widget: "list"
        required: false
        summary: "{{fields.label}} → {{fields.url}}"
        fields:
          - { label: "Label (small caps)", name: "label", widget: "string" }
          - { label: "Link text", name: "text", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "External (new tab)?", name: "external", widget: "boolean", default: false, required: false }
          - { label: "Note under link", name: "note", widget: "string", required: false }
      - label: "Plates (images)"
        name: "plates"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Detail line (HTML allowed)", name: "detail", widget: "string", required: false }
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string", required: false }
          - { label: "Caption (left)", name: "caption", widget: "string", required: false }
          - { label: "Credit (right)", name: "credit", widget: "string", required: false }
          - label: "Shape"
            name: "shape"
            widget: "select"
            options: ["tall", "wide", "square"]
            default: "tall"
          - { label: "Contain (don't crop)", name: "contain", widget: "boolean", default: false, required: false }

  # ░░░ Writing ░░░
  - name: "writing"
    label: "Writing"
    label_singular: "Writing entry"
    folder: "src/writing-entries"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{year}} — {{title}}"
    sortable_fields: ["sort_year", "year", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Code", name: "code", widget: "string", required: false }
      - { label: "Year (display)", name: "year", widget: "string" }
      - { label: "Year (for sorting)", name: "sort_year", widget: "string" }
      - { label: "Publication", name: "publication", widget: "string", required: false }
      - { label: "Language", name: "language", widget: "string", required: false }
      - { label: "External URL", name: "external_url", widget: "string", required: false }
      - { label: "PDF / file path", name: "file", widget: "file", required: false }

  # ░░░ Site settings ░░░
  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Site"
        file: "src/_data/site.json"
        format: "json"
        fields:
          - { label: "Site title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Year", name: "year", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Site URL", name: "url", widget: "string" }
